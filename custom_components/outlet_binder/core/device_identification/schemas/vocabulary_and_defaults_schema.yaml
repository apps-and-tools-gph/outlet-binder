# JSON Schema (draft 2020-12) for one integration's vocabulary-and-defaults file,
# device_patterns/<integration_domain>/vocabulary_and_defaults.yaml (#681).
# Consumed by facility_loader.py and by an editor via yaml-language-server's
# `# yaml-language-server: $schema=...` modeline. It is a first check only: that
# every `socket` facility is in OB's facility vocabulary and in its own domain, that
# `ob_on_off` is never mapped, and that no facility is mapped twice are
# facility_loader.py's checks, and the authority for those, as is the check that
# no entity could satisfy two entries (their domain, `unique_id_suffix` and
# `device_class` overlap). A repeated name under one domain is a duplicate YAML
# key, which the YAML loader refuses.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Integration vocabulary and defaults
type: object
additionalProperties: false
required:
  - vocabulary
properties:
  vocabulary:
    description: >-
      Every entity the integration offers that OB lists, grouped by the HA
      domain of the entity. Each entry's key is its name, the `<name>` in
      `<integration>_<name>`. Beside it are the facts that recognise the entity
      and its optional default. An entity no entry recognises gets no OB entity,
      and OB raises a Repairs issue for it.
    type: object
    minProperties: 1
    propertyNames:
      pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
    additionalProperties:
      description: >-
        The entries of one HA domain (sensor, switch, number, ...), each name
        to its recognising facts and default.
      type: object
      minProperties: 1
      propertyNames:
        pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
      additionalProperties:
        $ref: "#/$defs/entry"
$defs:
  entry:
    description: >-
      One entity: the facts that recognise it, and what OB makes of it. With
      neither `socket` nor `device`, the integration offers the entity and OB
      has no name for it: it is offered as `<integration>_<name>`. `device`
      means it exists only at the CO level, such as the restart button or the
      Wi-Fi signal: a CO Socket has no such facility, so an Appliance never
      mirrors it. `socket: <facility>` means a CO Socket has it, and an
      Appliance mirrors it as that facility.
    type: object
    additionalProperties: false
    required:
      - unique_id_suffix
    not:
      required:
        - socket
        - device
    properties:
      unique_id_suffix:
        description: >-
          What the entity's `unique_id` ends with, compared literally. It must
          name one entity of the device, not a kind of entity.
        type: string
        minLength: 1
      device_class:
        description: >-
          An HA device class the entity must also have, as well as the ending.
          Optional: the ending alone recognises the entity.
        type: string
        pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
      device:
        description: >-
          True for an entity of the plug or strip itself, not of a socket.
        const: true
      socket:
        description: >-
          The facility's key (`ha_` or `ob_`, then lowercase words); it must
          be in OB's facility vocabulary, in this domain. When the facility's entity
          id ending differs from the entry's name, an Appliance gets two
          entities for it, one under each name.
        type: string
        pattern: "^(ha|ob)_[a-z0-9]+(_[a-z0-9]+)*$"
